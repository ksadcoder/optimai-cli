name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile all bot modules
        run: python -m py_compile bot/*.py

      - name: Run smoke suite (no network, no real Telegram)
        run: python tests/smoke_test.py

      - name: Run pytest wrapper
        run: pytest -q

      - name: Validate docker compose configuration
        run: |
          cp .env.example .env
          sed -i 's/^TELEGRAM_BOT_TOKEN=$/TELEGRAM_BOT_TOKEN=000:ci-dummy/' .env
          sed -i 's/^TELEGRAM_ALLOWED_IDS=$/TELEGRAM_ALLOWED_IDS=123456789/' .env
          docker compose config > /dev/null
          rm .env
